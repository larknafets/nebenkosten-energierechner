{{define "layout"}}<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebenkosten-Energierechner</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --border: #e0e2e7; --text: #1c1e21;
    --muted: #6b7280; --accent: #2563eb; --accent-soft: #eef2ff;
    --cat-strom: #f59e0b; --cat-heizung: #ef4444; --cat-wasser: #3b82f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  h1, h2, h3 { margin: 0 0 .5rem; }
  .app { max-width: 700px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
  .muted { color: var(--muted); font-size: .85rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .25rem; }
  input[type=number], input[type=date], select { width: 100%; padding: .5rem .6rem; border: 1px solid var(--border); border-radius: 6px; font-size: .95rem; }
  .field { margin-bottom: .9rem; }
  .radio-options { display: flex; gap: 1.25rem; flex-wrap: wrap; }
  .radio-option { display: flex; align-items: center; gap: .35rem; width: auto; font-size: .9rem; color: var(--text); margin-bottom: 0; }
  .radio-option input[type=radio] { width: auto; }
  .warning { color: #b45309; font-size: .8rem; margin-top: .25rem; min-height: 1em; white-space: pre-line; }
  .grid { display: grid; gap: 1rem; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  button.primary { background: var(--accent); color: white; border: none; border-radius: 6px; padding: .6rem 1.1rem; font-size: .9rem; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: .6rem 1.1rem; font-size: .9rem; cursor: pointer; }
  button.danger { background: transparent; color: #b91c1c; border: 1px solid #b91c1c; border-radius: 6px; padding: .4rem .8rem; font-size: .85rem; cursor: pointer; }
  .wizard-actions { display: flex; justify-content: space-between; margin-top: 1.25rem; }
  .c-steps { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
  .c-step-dot { flex: 1; text-align: center; padding: .5rem; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 600; }
  .c-step-dot.active { background: var(--accent); color: white; }
  .c-pane { display: none; }
  .c-pane.active { display: block; }
  .formula { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: .75rem 1rem; font-size: .85rem; overflow-x: auto; white-space: pre; }
  table.letzte { width: 100%; border-collapse: collapse; font-size: .9rem; }
  table.letzte th, table.letzte td { padding: .4rem .5rem; text-align: left; border-bottom: 1px solid var(--border); }
  .badge { display: inline-block; background: var(--accent-soft); color: var(--accent); font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; }
  .stat-card .stat-value { font-size: 1.5rem; font-weight: 700; margin-top: .3rem; }
  .stat-bar-track { display: flex; height: .5rem; border-radius: 999px; overflow: hidden; background: var(--border); margin-top: .5rem; }
  .stat-bar-seg { height: 100%; }
  .cat-strom { background: var(--cat-strom); }
  .cat-heizung { background: var(--cat-heizung); }
  .cat-wasser { background: var(--cat-wasser); }
  .stat-kategorien { margin-top: .4rem; white-space: normal; overflow-wrap: break-word; }

  .verlauf-legend { display: flex; align-items: center; gap: 1.25rem; font-size: .75rem; color: var(--muted); margin-bottom: .9rem; flex-wrap: wrap; }
  .verlauf-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: .35rem; vertical-align: middle; }
  .verlauf-modus-toggle { margin-left: auto; padding: .3rem .7rem; font-size: .75rem; }
  .verbrauch-liste { display: none; font-size: .72rem; color: var(--muted); }
  .verlauf-panel.modus-verbrauch .bar-track { display: none; }
  .verlauf-panel.modus-verbrauch .verbrauch-liste { display: block; }
  .verlauf-tooltip { display: none; position: fixed; background: var(--text); color: #fff; font-size: .72rem; font-weight: 600; padding: .25rem .5rem; border-radius: 4px; pointer-events: none; z-index: 30; white-space: nowrap; }
  .verlauf-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .verlauf-col h4 { font-size: .8rem; color: var(--muted); margin: 0 0 .5rem; }
  .verlauf-row { display: flex; align-items: center; gap: .5rem; padding: .3rem 0; }
  .verlauf-row.is-current .month-label { font-weight: 700; color: var(--text); }
  .month-label { width: 60px; font-size: .72rem; color: var(--muted); flex-shrink: 0; }
  .value-label { width: 60px; text-align: right; font-size: .78rem; font-weight: 600; flex-shrink: 0; }
  .bar-track { flex: 1; min-width: 0; height: 20px; border-radius: 4px; background: var(--border); display: flex; overflow: hidden; }
  .bar-track > div { height: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .bar-track > div span { color: #fff; font-size: .68rem; font-weight: 600; white-space: nowrap; padding: 0 .2rem; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .verlauf-row.is-current .bar-track { box-shadow: 0 0 0 2px var(--accent); }
  .verlauf-year-sep { display: flex; align-items: center; gap: .6rem; margin: .6rem 0 .35rem; }
  .verlauf-year-sep .line { flex: 1; height: 1px; background: var(--border); }
  .verlauf-year-sep .label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
  .verlauf-year-row { display: flex; justify-content: space-between; align-items: center; background: var(--accent-soft); border-radius: 6px; padding: .5rem .7rem; margin-bottom: .5rem; font-weight: 700; font-size: .85rem; color: var(--accent); }

  @media (max-width: 480px) {
    .app { padding: 1rem 1rem 3rem; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .c-steps { flex-wrap: wrap; }
    .c-step-dot { flex: 1 1 45%; font-size: .75rem; }
    .verlauf-wrap { grid-template-columns: 1fr; }
    .verlauf-row { flex-wrap: wrap; row-gap: .2rem; }
    .month-label { order: 1; }
    .value-label { order: 2; margin-left: auto; }
    .bar-track { order: 3; flex-basis: 100%; }
    .verbrauch-liste { order: 3; flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  {{template "content" .}}
</div>
</body>
</html>
{{end}}
