{{define "content"}}
<h1>Ablesung erfassen</h1>

<form method="post" action="/ablesungen" class="panel">
  <div class="field" style="max-width:220px">
    <label>Ablesedatum</label>
    <input type="date" name="reading_date" value="{{.ReadingDate}}" required {{if .HasPrevious}}data-prev-date="{{.PreviousReadingDate}}"{{end}}>
    <div class="warning" id="warn-reading_date"></div>
  </div>

  <div class="c-steps">
    <div class="c-step-dot active" data-step="1">1 · Strom</div>
    <div class="c-step-dot" data-step="2">2 · Wasser</div>
    <div class="c-step-dot" data-step="3">3 · Wärme</div>
    <div class="c-step-dot" data-step="4">4 · Preise &amp; Personen</div>
  </div>

  <div class="c-pane active" data-step="1">
    <div class="grid grid-2">
      <div class="field"><label>Gesamt (Netzbezug) kWh</label><input type="number" step="0.01" name="strom_gesamt" required {{if $.HasPrevious}}data-prev="{{index $.PreviousReadings "strom_gesamt"}}"{{end}}><div class="warning" id="warn-strom_gesamt"></div></div>
      <div class="field"><label>Wohnung 2 kWh</label><input type="number" step="0.01" name="strom_wohnung2" required {{if $.HasPrevious}}data-prev="{{index $.PreviousReadings "strom_wohnung2"}}"{{end}}><div class="warning" id="warn-strom_wohnung2"></div></div>
      <div class="field"><label>Wärmepumpe kWh</label><input type="number" step="0.01" name="strom_waermepumpe" required {{if $.HasPrevious}}data-prev="{{index $.PreviousReadings "strom_waermepumpe"}}"{{end}}><div class="warning" id="warn-strom_waermepumpe"></div></div>
      <div class="field"><label>Wallboxen kWh</label><input type="number" step="0.01" name="strom_wallbox" required {{if $.HasPrevious}}data-prev="{{index $.PreviousReadings "strom_wallbox"}}"{{end}}><div class="warning" id="warn-strom_wallbox"></div></div>
    </div>
  </div>

  <div class="c-pane" data-step="2">
    <div class="grid grid-3">
      <div class="field"><label>Gesamt m³</label><input type="number" step="0.01" name="wasser_gesamt" required {{if $.HasPrevious}}data-prev="{{index $.PreviousReadings "wasser_gesamt"}}"{{end}}><div class="warning" id="warn-wasser_gesamt"></div></div>
      <div class="field"><label>Wohnung 2 m³</label><input type="number" step="0.01" name="wasser_wohnung2" required {{if $.HasPrevious}}data-prev="{{index $.PreviousReadings "wasser_wohnung2"}}"{{end}}><div class="warning" id="warn-wasser_wohnung2"></div></div>
      <div class="field"><label>Warmwasseraufbereitung m³</label><input type="number" step="0.01" name="wasser_warmwasseraufbereitung" required {{if $.HasPrevious}}data-prev="{{index $.PreviousReadings "wasser_warmwasseraufbereitung"}}"{{end}}><div class="warning" id="warn-wasser_warmwasseraufbereitung"></div></div>
    </div>
  </div>

  <div class="c-pane" data-step="3">
    <div class="grid grid-2">
      {{range .Apartments}}
      {{$key := printf "waerme_wohnung%d" .ID}}
      <div class="field"><label>{{.Name}} MWh</label><input type="number" step="0.01" name="{{$key}}" required {{if $.HasPrevious}}data-prev="{{index $.PreviousReadings $key}}"{{end}}><div class="warning" id="warn-{{$key}}"></div></div>
      {{end}}
    </div>
  </div>

  <div class="c-pane" data-step="4">
    <div class="grid grid-3">
      <div class="field"><label>Strompreis (EUR/kWh)</label><input type="number" step="0.01" name="strompreis" required></div>
      <div class="field"><label>Frischwasser (EUR/m³)</label><input type="number" step="0.01" name="frischwasser_preis" required></div>
      <div class="field"><label>Abwasser (EUR/m³)</label><input type="number" step="0.01" name="abwasser_preis" required></div>
    </div>
    <div class="grid grid-2">
      {{range .Apartments}}
      <div class="field"><label>Personen {{.Name}}</label><input type="number" name="personen_{{.ID}}" required></div>
      {{end}}
    </div>
    <div class="grid grid-2">
      {{range .Apartments}}
      <div class="field"><label>Wohnfläche {{.Name}} (m²)</label><input type="number" step="0.01" name="qm_{{.ID}}" value="{{.QM}}" required></div>
      {{end}}
    </div>
  </div>

  <div class="wizard-actions">
    <button type="button" class="secondary" id="btn-prev">← Zurück</button>
    <button type="button" class="secondary" id="btn-next">Weiter →</button>
    <button type="submit" class="primary" id="btn-save" style="display:none">Speichern &amp; berechnen</button>
  </div>
</form>

<script>
  const steps = Array.from(document.querySelectorAll('.c-pane')).map(el => el.dataset.step);
  let current = 0;

  function render() {
    document.querySelectorAll('.c-pane').forEach(el => el.classList.toggle('active', el.dataset.step === steps[current]));
    document.querySelectorAll('.c-step-dot').forEach(el => el.classList.toggle('active', el.dataset.step === steps[current]));
    document.getElementById('btn-prev').style.visibility = current === 0 ? 'hidden' : 'visible';
    document.getElementById('btn-next').style.display = current === steps.length - 1 ? 'none' : 'inline-block';
    document.getElementById('btn-save').style.display = current === steps.length - 1 ? 'inline-block' : 'none';
  }

  document.getElementById('btn-prev').addEventListener('click', () => { current = Math.max(0, current - 1); render(); });
  document.getElementById('btn-next').addEventListener('click', () => { current = Math.min(steps.length - 1, current + 1); render(); });

  render();

  // Anomaly warnings (Ticket #12) - hints only, never block Speichern.
  function checkNegative(input) {
    const warnEl = document.getElementById('warn-' + input.name);
    if (!warnEl) return;
    const prev = input.dataset.prev;
    if (prev === undefined || input.value === '') { warnEl.textContent = ''; return; }
    const newVal = parseFloat(input.value);
    const prevVal = parseFloat(prev);
    if (!isNaN(newVal) && !isNaN(prevVal) && newVal < prevVal) {
      warnEl.textContent = '⚠ Niedriger als letzter Stand (' + prevVal + ') – negativer Verbrauch';
    } else {
      warnEl.textContent = '';
    }
  }
  document.querySelectorAll('input[data-prev]').forEach(el => {
    el.addEventListener('input', () => checkNegative(el));
  });

  const dateInput = document.querySelector('input[name="reading_date"]');
  function checkGap() {
    const warnEl = document.getElementById('warn-reading_date');
    const prevDateStr = dateInput.dataset.prevDate;
    if (!warnEl || !prevDateStr || !dateInput.value) { if (warnEl) warnEl.textContent = ''; return; }
    const newDate = new Date(dateInput.value);
    const prevDate = new Date(prevDateStr);
    if (isNaN(newDate.getTime()) || isNaN(prevDate.getTime())) { warnEl.textContent = ''; return; }
    // Date.setMonth() overflows for day-of-month 29-31 into short months
    // (e.g. Jan 31 + 1 month -> Mar 2/3, not Feb 28/29) - clamp instead.
    const targetMonthFirst = new Date(prevDate.getFullYear(), prevDate.getMonth() + 1, 1);
    const lastDayOfTargetMonth = new Date(targetMonthFirst.getFullYear(), targetMonthFirst.getMonth() + 1, 0).getDate();
    const oneMonthLater = new Date(targetMonthFirst.getFullYear(), targetMonthFirst.getMonth(), Math.min(prevDate.getDate(), lastDayOfTargetMonth));
    if (newDate.getTime() > oneMonthLater.getTime()) {
      const diffDays = (newDate - prevDate) / (1000 * 60 * 60 * 24);
      const months = Math.round((diffDays / 30.44) * 10) / 10;
      warnEl.textContent = '⚠ Verbrauch über ' + months + ' Monate (letzte Ablesung: ' + prevDateStr + ')';
    } else {
      warnEl.textContent = '';
    }
  }
  if (dateInput) {
    dateInput.addEventListener('change', checkGap);
    checkGap();
  }
</script>
{{end}}
