{{define "content"}}
<h1>Ablesungen</h1>
<p class="muted"><a href="{{.Base}}/dashboard">Zum Dashboard</a></p>

{{if not .Periods}}
<p class="muted">Noch keine Ablesung erfasst. <a href="{{.Base}}/ablesungen/neu">Jetzt erfassen</a>.</p>
{{else}}
<div class="panel">
  <table class="letzte">
    <thead><tr><th>Ablesedatum</th><th></th></tr></thead>
    <tbody>
      {{range .Periods}}
      <tr><td>{{deDatum .ReadingDate}}</td><td><a href="{{$.Base}}/ablesungen/{{.ID}}">Details</a></td></tr>
      {{end}}
    </tbody>
  </table>
</div>

<p style="margin-top:1rem"><a href="{{.Base}}/ablesungen/neu">Neue Ablesung erfassen</a></p>
{{end}}
{{end}}
